<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Qarzdorlar Nazorati</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f7f7f5;--card:#fff;--border:#ebebe8;--t:#111;--m:#999;--r:#dc3545;--g:#198754;--a:#111;--rad:12px}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.view{display:none;flex-direction:column;min-height:100vh}.view.active{display:flex}

/* NAV */
.nav{padding:14px 16px 0;background:var(--bg);position:sticky;top:0;z-index:9}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav-title{font-size:20px;font-weight:700;letter-spacing:-.4px}
.nav-sub{font-size:13px;color:var(--m);margin-bottom:12px}

/* SEARCH */
.sb{position:relative;margin:0 16px 14px}
.sb input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);background:var(--card);border-radius:10px;font-size:15px;outline:none;color:var(--t)}
.sb::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}

/* HERO HERO */
.hero{margin:0 16px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{display:flex;flex-direction:column}
.hl{font-size:12px;color:var(--m);margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px;font-weight:500}
.hv{font-size:20px;font-weight:700;letter-spacing:-.5px}
.hv.g{color:var(--g)}.hv.r{color:var(--r)}

/* LIST */
.list{margin:0 16px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.item:last-child{border-bottom:none}
.item:active{background:#f9f9f9}
.in{font-size:16px;font-weight:600;letter-spacing:-.2px;margin-bottom:2px}
.it{font-size:12px;color:var(--m)}
.ir{text-align:right}
.iam{font-size:16px;font-weight:700;letter-spacing:-.3px}
.iam.r{color:var(--r)}.iam.g{color:var(--g)}
.ibd{font-size:11px;color:var(--m);margin-top:2px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* DETAIL VIEW */
.dh{padding:14px 16px;background:var(--bg);position:sticky;top:0;z-index:9;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.back{background:none;border:none;font-size:22px;cursor:pointer;padding:4px;color:var(--a)}
.dtitle{font-size:18px;font-weight:700;letter-spacing:-.3px}
.dhero{margin:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:16px;text-align:center}
.dhl{font-size:13px;color:var(--m);margin-bottom:4px}
.dhv{font-size:28px;font-weight:800;letter-spacing:-.5px}

/* ACTIONS */
.act{margin:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity:.1s}
.btn:active{opacity:.8}
.btn-p{background:var(--a);color:#fff}
.btn-s{background:#e3e3e0;color:var(--t)}
.btn-r{background:#feecef;color:var(--r)}

/* FORM CARD */
.fc{margin:0 16px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:16px}
.frow{display:flex;gap:10px;margin-bottom:10px}
.frow input,.fc input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#f9f9f7}
.frow input:focus,.fc input:focus{border-color:var(--a);background:#fff}

/* TX TABLE */
.txs{margin:0 16px 30px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden}
.txtr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.txtr:last-child{border-bottom:none}
.txm{font-size:15px;font-weight:700}
.txm.r{color:var(--r)}.txm.g{color:var(--g)}
.txn{font-size:12px;color:var(--m);margin-top:2px}
.txd{font-size:11px;color:var(--m);text-align:right}
.txdel{background:none;border:none;color:var(--r);font-size:13px;cursor:pointer;margin-top:4px}

/* MODAL */
.m-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:99;display:none;align-items:flex-end}
.m-bg.on{display:flex}
.m-c{width:100%;background:var(--card);border-top-left-radius:16px;border-top-right-radius:16px;padding:20px 16px 30px;transform:translateY(100%);transition:transform .2s ease-out}
.m-bg.on .m-c{transform:translateY(0)}
.m-h{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}

.fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;background:var(--a);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.15);border:none;cursor:pointer;z-index:8}
.empty{padding:40px;text-align:center;color:var(--m);font-size:14px}
</style>
</head>
<body>

<div id="v_main" class="view active">
  <div class="nav">
    <div class="nav-row">
      <div class="nav-title">Qarzdorlar</div>
      <button class="btn btn-s" style="padding:6px 12px;font-size:12px" onclick="expTxT()">📥 TXT Yuklash</button>
    </div>
    <div class="nav-sub" id="v_sub">Yuklanmoqda...</div>
  </div>
  
  <div class="sb">
    <input type="text" id="srch" placeholder="Qidirish..." oninput="renderP()">
  </div>
  
  <div class="hero">
    <div class="hc"><span class="hl">Umumiy Qarz</span><span class="hv r" id="h_tot">0</span></div>
    <div class="hc"><span class="hl">Faol Odamlar</span><span class="hv" id="h_act">0</span></div>
  </div>
  
  <div id="p_list" class="list"></div>
  <button class="fab" onclick="openM()">+</button>
</div>

<div id="v_det" class="view">
  <div class="dh">
    <button class="back" onclick="goB()">←</button>
    <div class="dtitle" id="d_name">...</div>
  </div>
  
  <div class="dhero">
    <div class="dhl">Balans</div>
    <div class="dhv" id="d_tot">0</div>
  </div>
  
  <div class="fc">
    <div class="frow">
      <input type="number" id="iamt" placeholder="Summa (so'm)">
      <input type="text" id="inote" placeholder="Izoh (ixtiyoriy)">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-p" style="flex:1;background:var(--g)" onclick="addTx(1)">➕ Qarz Qo'shish</button>
      <button class="btn btn-p" style="flex:1;background:var(--r)" onclick="addTx(-1)">➖ Haq To'lash</button>
    </div>
  </div>
  
  <div id="t_list" class="txs"></div>
  
  <div style="margin:0 16px 30px">
    <button class="btn btn-r" style="width:100%" onclick="delP()">🗑️ Mijozni O'chirish</button>
  </div>
</div>

<div id="modal" class="m-bg" onclick="mbgClk(e)">
  <div class="m-c" onclick="event.stopPropagation()">
    <div class="m-h">Yangi Mijoz Qo'shish</div>
    <input type="text" id="mn" placeholder="F.I.Sh." style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;outline:none"><br>
    <input type="number" id="ma" placeholder="Boshlang'ich qarz summasi (ixtiyoriy)" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;margin-bottom:16px;outline:none">
    <div style="display:flex;gap:10px">
      <button class="btn btn-s" style="flex:1" onclick="document.getElementById('modal').classList.remove('on')">Yopish</button>
      <button class="btn btn-p" style="flex:1" onclick="addP()">Saqlash</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand(); tg?.ready();
const initData = tg?.initData || "";

const me = tg?.initDataUnsafe?.user;
const WHO = me ? (me.first_name + (me.last_name ? ' ' + me.last_name : '')) : 'Sotuvchi';

// API markazi - Xavfsizlik sarlavhasi (X-TG-Init-Data) qo'shildi
const api = {
  get: u => fetch(u).then(r => { if(!r.ok) throw r; return r.json(); }),
  post: (u, b) => fetch(u, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-TG-Init-Data': initData },
    body: JSON.stringify(b)
  }).then(async r => { if(!r.ok) { const err = await r.json(); throw err; } return r.json(); }),
  del: u => fetch(u, {
    method: 'DELETE',
    headers: { 'X-TG-Init-Data': initData }
  }).then(async r => { if(!r.ok) { const err = await r.json(); throw err; } return r.json(); }),
};

let P = [], cid = null, ctot = 0, cbd = [];

function fmtS(v) { return Number(v).toLocaleString('ru-RU').replace(/,/g, ' ') + ' so\'m'; }
function fmtD(s) { if(!s) return ''; const d = new Date(s); return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}); }

async function load() {
  try {
    document.getElementById('v_sub').innerText = 'Yangilanmoqda...';
    P = await api.get('/api/persons');
    const s = await api.get('/api/stats');
    document.getElementById('h_tot').innerText = fmtS(s.total);
    document.getElementById('h_act').innerText = s.active;
    
    let sub = `Jami: ${P.length} odam`;
    if(s.top && s.top.length > 0) sub += ` | Katta qarz: ${s.top[0].name}`;
    document.getElementById('v_sub').innerText = sub;
    
    renderP();
  } catch(e) { 
    document.getElementById('v_sub').innerText = 'Yuklashda xato!'; 
  }
}

function renderP() {
  const q = document.getElementById('srch').value.toLowerCase().strip();
  const el = document.getElementById('p_list');
  el.innerHTML = '';
  const fil = P.filter(x => x.name.toLowerCase().includes(q));
  if(fil.length === 0) { el.innerHTML = '<div class="empty">Mijoz topilmadi</div>'; return; }
  
  fil.forEach(p => {
    const div = document.createElement('div');
    div.className = 'item';
    div.onclick = () => goD(p.id, p.name, p.total, p.breakdown);
    
    const parts = (p.breakdown || []).map(x => Math.floor(x));
    const bdStr = parts.length > 0 ? parts.join(' + ') : '';
    
    div.innerHTML = `
      <div>
        <div class="in">${p.name}</div>
        <div class="it">${p.tx_count} ta amal</div>
      </div>
      <div class="ir">
        <div class="iam ${p.total > 0 ? 'r' : 'g'}">${fmtS(p.total)}</div>
        <div class="ibd" title="${bdStr}">${bdStr}</div>
      </div>
    `;
    el.appendChild(div);
  });
}

function goD(id, name, tot, bd) {
  cid = id; ctot = tot; cbd = bd || [];
  document.getElementById('v_main').classList.remove('active');
  document.getElementById('v_det').classList.add('active');
  document.getElementById('d_name').innerText = name;
  updHero();
  loadTx(id);
}

function goB() {
  document.getElementById('v_det').classList.remove('active');
  document.getElementById('v_main').classList.add('active');
  load();
}

function updHero() {
  const el = document.getElementById('d_tot');
  el.innerText = fmtS(ctot);
  el.className = 'dhv ' + (ctot > 0 ? 'r' : 'g');
}

async function loadTx(pid) {
  const el = document.getElementById('t_list');
  el.innerHTML = '<div class="empty">Yuklanmoqda...</div>';
  try {
    const txs = await api.get(`/api/persons/${pid}/transactions`);
    el.innerHTML = '';
    if(txs.length === 0) { el.innerHTML = '<div class="empty">Amallar mavjud emas</div>'; return; }
    txs.forEach(t => {
      const div = document.createElement('div');
      div.className = 'txtr';
      div.innerHTML = `
        <div>
          <div class="txm ${t.amount > 0 ? 'r' : 'g'}">${t.amount > 0 ? '+' : ''}${fmtS(t.amount)}</div>
          <div class="txn">${t.note || 'Izohsiz'} <span style="opacity:0.6;font-size:10px">by ${t.added_by||'Sotuvchi'}</span></div>
        </div>
        <div class="txd">
          <div>${fmtD(t.created_at)}</div>
          <button class="txdel" onclick="delTx(${t.id})">O'chirish</button>
        </div>
      `;
      el.appendChild(div);
    });
  } catch { 
    el.innerHTML = '<div class="empty">Xatolik yuz berdi</div>'; 
  }
}

async function addTx(dir) {
  let amt = Number(document.getElementById('iamt').value);
  const note = document.getElementById('inote').value.trim();
  if(!amt || amt <= 0) { document.getElementById('iamt').focus(); return; }
  amt = amt * dir;
  try {
    await api.post('/api/transactions', { person_id: cid, amount: amt, note: note || null, added_by: WHO });
    document.getElementById('iamt').value = ''; 
    document.getElementById('inote').value = '';
    ctot += amt; 
    if(dir > 0) cbd.push(amt);
    updHero(); 
    await loadTx(cid);
  } catch(err) {
    alert(err.detail || 'Xatolik! Sizda sotuvchi huquqi yo\'q yoki seans tugagan.');
  }
}

async function delTx(tid) {
  if(!confirm('Ushbu amalni o\'chirishni xohlaysizmi?')) return;
  try {
    await api.del(`/api/transactions/${tid}`);
    await loadTx(cid);
    const updatedPerson = await api.get('/api/persons');
    const match = updatedPerson.find(x => x.id === cid);
    if(match) { ctot = match.total; cbd = match.breakdown; updHero(); }
  } catch(err) {
    alert(err.detail || 'Xatolik! Tranzaksiyani o\'chirish uchun sotuvchi bo\'lishingiz kerak.');
  }
}

async function addP() {
  const name = document.getElementById('mn').value.trim();
  const amt = Number(document.getElementById('ma').value) || 0;
  if(!name) { document.getElementById('mn').focus(); return; }
  try {
    const per = await api.post('/api/persons', { name });
    if(amt > 0) {
      await api.post('/api/transactions', { person_id: per.id, amount: amt, note: "Boshlang'ich qarz", added_by: WHO });
    }
    document.getElementById('modal').classList.remove('on');
    document.getElementById('mn').value = '';
    document.getElementById('ma').value = '';
    await load();
  } catch(err) {
    alert(err.detail || 'Xatolik! Yangi mijoz qo\'shish uchun sotuvchi bo\'lishingiz kerak.');
  }
}

async function delP() {
  if(!confirm('Bu mijozni va uning barcha amallarini butunlay o\'chirmoqchimisiz?')) return;
  try {
    await api.del(`/api/persons/${cid}`);
    goB();
  } catch(err) {
    alert(err.detail || 'Xatolik! Mijozni o\'chirish uchun sotuvchi bo\'lishingiz kerak.');
  }
}

function expTxT() {
  if(P.length === 0) return;
  let total = 0, lines = ['=== QARZDORLAR RO\'YXATI ===',''];
  P.forEach(p => {
    total += p.total;
    lines.push(p.total > 0 ? `${p.name}: ${fmtS(p.total)}` : `${p.name}: Qarz yo'q`);
  });
  lines.push('', 'Jami qarzlar: ' + fmtS(total));
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `qarzdorlar_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

function openM() {
  document.getElementById('mn').value = '';
  document.getElementById('ma').value = '';
  document.getElementById('modal').classList.add('on');
  setTimeout(() => document.getElementById('mn').focus(), 80);
}

function mbgClk(e) {
  if(e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('on');
  }
}

if (!String.prototype.strip) {
  String.prototype.strip = function () { return this.replace(/^\s+|\s+$/g, ''); };
}

window.onload = load;
</script>
</body>
</html>
