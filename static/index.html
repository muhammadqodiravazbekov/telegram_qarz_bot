<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Control</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root {
  --bg: #f4f4f7; --card: #ffffff; --border: rgba(0,0,0,0.04);
  --t: #000000; --m: #8e8e93; --r: #ff3b30; --g: #34c759;
  --a: #007ff5; --rad: 14px; --shadow: 0 4px 20px rgba(0,0,0,0.03);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0b0d; --card: #16161a; --border: rgba(255,255,255,0.05);
    --t: #ffffff; --m: #7c7c80; --r: #ff453a; --g: #32d74b;
    --a: #0a84ff; --shadow: 0 4px 25px rgba(0,0,0,0.2);
  }
}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.view{display:none;flex-direction:column;min-height:100vh;animation: fadeIn 0.2s ease}.view.active{display:flex}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* MINIMAL NAV */
.nav{padding:20px 16px 10px;background:var(--bg);position:sticky;top:0;z-index:9}
.nav-row{display:flex;align-items:center;justify-content:space-between}
.nav-title{font-size:24px;font-weight:800;letter-spacing:-0.6px}
.nav-sub{font-size:13px;color:var(--m);margin-top:2px}
.icon-btn{background:var(--card);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;box-shadow:var(--shadow);color:var(--t)}
.nav-back{background:none;border:none;font-size:24px;color:var(--t);cursor:pointer;margin-right:12px;font-weight:300}

/* SEARCH */
.search{margin:12px 16px 6px}
.search input{width:100%;padding:12px 16px;background:var(--card);border:none;border-radius:12px;font-size:15px;color:var(--t);outline:none;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--m);opacity:0.7}

/* STATS CARDS */
.stats{display:flex;gap:10px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}.stats::-webkit-scrollbar{display:none}
.sc{background:var(--card);border-radius:var(--rad);padding:14px;flex-shrink:0;min-width:115px;box-shadow:var(--shadow)}
.sc-l{font-size:11px;color:var(--m);font-weight:500;margin-bottom:4px}
.sc-v{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.sc-v.r{color:var(--r)}.sc-v.g{color:var(--g)}

/* TABS & FILTERS */
.ftabs{display:flex;gap:6px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}.ftabs::-webkit-scrollbar{display:none}
.ft{padding:7px 14px;border-radius:30px;border:none;background:var(--card);font-size:13px;font-weight:500;color:var(--m);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.ft.on{background:var(--t);color:var(--bg)}

.sortbar{display:flex;gap:8px;padding:0 16px 14px;align-items:center;font-size:12px;color:var(--m)}
.sb{background:none;border:none;color:var(--m);font-weight:600;cursor:pointer;font-size:12px}
.sb.on{color:var(--a)}

/* CLEAN LIST */
.lst{padding:0 16px 100px}
.pi{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);margin-bottom:8px;border-radius:var(--rad);cursor:pointer;box-shadow:var(--shadow)}
.pi:active{opacity:.8}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.av.r{background:linear-gradient(135deg,#ff512f,#dd2476)}
.av.o{background:linear-gradient(135deg,#ff9900,#ff5b00)}
.av.g{background:linear-gradient(135deg,#11998e,#38ef7d)}
.av.x{background:#8e8e93}
.pi-info{flex:1;min-width:0}
.pi-name{font-size:15px;font-weight:600;letter-spacing:-0.2px;display:flex;align-items:center;gap:4px}
.pi-bd{font-size:12px;color:var(--m);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-amt{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px}
.badge.paid{background:rgba(52,199,89,0.15);color:var(--g)}

/* DETAIL VIEW HERO */
.d-hero{padding:24px 16px;text-align:center;background:var(--bg)}
.d-amt{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.d-amt.r{color:var(--r)}.d-amt.g{color:var(--g)}
.d-bd{font-size:13px;color:var(--m);max-width:280px;margin:0 auto;line-height:1.5}

.action-row{display:flex;gap:10px;padding:0 16px 16px}
.act-btn{flex:1;padding:12px;border-radius:12px;border:none;background:var(--card);font-size:14px;font-weight:600;cursor:pointer;color:var(--t);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px}
.act-btn.green{background:var(--g);color:#fff}

/* TRANSACTIONS */
.txw{padding:0 16px 140px}
.tx{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.tx-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.tx-ic.d{background:rgba(255,59,48,0.1);color:var(--r)}
.tx-ic.c{background:rgba(52,199,89,0.1);color:var(--g)}
.tx-info{flex:1;min-width:0}
.tx-a{font-size:14px;font-weight:700}
.tx-m{font-size:12px;color:var(--m);margin-top:2px}
.tx-del{background:none;border:none;color:var(--m);font-size:20px;cursor:pointer;padding:0 8px;opacity:0.4}
.tx-del:hover{opacity:1;color:var(--r)}

/* ACTION BAR BOTTOM */
.addbar{padding:12px 16px 30px;background:var(--card);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;width:100%;z-index:9;display:flex;gap:8px;box-shadow:0 -4px 20px rgba(0,0,0,0.02)}
.addbar input{background:var(--bg);border:none;border-radius:10px;padding:12px;font-size:14px;color:var(--t);outline:none}
.ai{width:110px!important}
.addbtn{width:46px;background:var(--t);color:var(--bg);border:none;border-radius:10px;font-size:20px;font-weight:600;cursor:pointer}

/* FAB & MODALS */
.fab{position:fixed;bottom:100px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--t);color:var(--bg);font-size:26px;border:none;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,0.15);z-index:8;display:flex;align-items:center;justify-content:center}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:40;align-items:flex-end}
.mbg.on{display:flex}
.modal{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px 40px;box-shadow: 0 -10px 30px rgba(0,0,0,0.05);animation: slideUp 0.25s ease-out}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.mbar{width:36px;height:4px;border-radius:2px;background:var(--bg);margin:0 auto 16px}
.mt{font-size:18px;font-weight:700;margin-bottom:16px;letter-spacing:-0.3px}
.modal input{width:100%;padding:12px 14px;background:var(--bg);border:none;border-radius:12px;font-size:15px;color:var(--t);outline:none;margin-bottom:10px}
.msub{width:100%;padding:14px;background:var(--t);color:var(--bg);border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.empty{text-align:center;padding:60px 20px;color:var(--m);font-size:14px}
</style>
</head>
<body>

<div id="vl" class="view active">
  <div class="nav">
    <div class="nav-row">
      <div><div class="nav-title">Qarzdorlar</div><div class="nav-sub" id="lsub">Yuklanmoqda…</div></div>
      <button class="icon-btn" onclick="exportTxt()">📥</button>
    </div>
  </div>
  <div class="search"><input id="sq" type="text" placeholder="Qidirish (ism, latin/kirill)…" oninput="onSrch()" autocomplete="off"></div>
  <div class="stats" id="stats"></div>
  <div class="ftabs">
    <button class="ft on" onclick="setF('all',this)">Hammasi</button>
    <button class="ft" onclick="setF('high',this)">≥200K</button>
    <button class="ft" onclick="setF('mid',this)">50–200K</button>
    <button class="ft" onclick="setF('low',this)">&lt;50K</button>
    <button class="ft" onclick="setF('paid',this)">To'langan</button>
  </div>
  <div class="sortbar">
    <span>Saralash:</span>
    <button class="sb on" onclick="setSort('amt',this)">Summa</button> · 
    <button class="sb" onclick="setSort('name',this)">Ism</button> · 
    <button class="sb" onclick="setSort('tx',this)">Amallar</button>
  </div>
  <div class="lst" id="plist"></div>
  <button class="fab" onclick="openM()">+</button>
</div>

<div id="vd" class="view">
  <div class="nav">
    <div class="nav-row" style="justify-content: flex-start;">
      <button class="nav-back" onclick="closeD()">←</button>
      <div style="flex:1"><div class="nav-title" id="dn" style="font-size:18px"></div></div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" onclick="shareDebt()" title="Ulashish">🚀</button>
        <button class="icon-btn" onclick="deleteP()" style="color:var(--r)">🗑</button>
      </div>
    </div>
  </div>
  <div class="d-hero">
    <div class="d-amt" id="damt"></div>
    <div class="d-bd" id="dbd"></div>
  </div>
  <div class="action-row">
    <button class="act-btn green" onclick="markPaid()">✓ To'liq yopish</button>
    <button class="act-btn" onclick="partPay()"> Qisman o'chirish</button>
  </div>
  <div class="txw" id="txlist"></div>
  <div class="addbar">
    <input class="ai" id="iamt" type="number" placeholder="Summa" inputmode="numeric">
    <input id="inote" type="text" placeholder="Izoh yozish…">
    <button class="addbtn" onclick="addTx()">+</button>
  </div>
</div>

<div class="mbg" id="modal" onclick="mbgClk(event)">
  <div class="modal">
    <div class="mbar"></div>
    <div class="mt">Yangi mijoz sahifasi</div>
    <input id="mn" type="text" placeholder="Ism (Zulfiya xola)">
    <input id="ma" type="number" placeholder="Boshlang'ich qarz summasi (ixtiyoriy)" inputmode="numeric">
    <button class="msub" onclick="addP()">Saqlash</button>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
tg?.expand();tg?.ready();
const me=tg?.initDataUnsafe?.user;
const WHO=me?(me.first_name+(me.last_name?' '+me.last_name:'')):'Sotuvchi';

let P=[],cid=null,ctot=0,cbd=[],filt='all',srch='',srt='amt';

const fmt=n=>Number(n).toLocaleString('ru-RU').replace(/,/g,' ');
const fmtS=n=>fmt(n)+" so'm";
function fmtD(s){if(!s)return '';const d=new Date(s);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function av(t){return t>0?(t>=200000?'r':'o'):'g';}
function ini(n){return n.trim().split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('');}
function esc(s){if(!s)return '';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const C2L={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','х':'x','ц':'ts','ч':'ch','ш':'sh','ю':'yu','я':'ya','қ':'q','ғ':"g'",'ҳ':'h','ў':"o'"};
function normalize(s){
  let str = s.toLowerCase().replace(/x/g, 'h').replace(/[‘’'’`ʼ]/g, '');
  return str.split('').map(c=>C2L[c]||c).join('');
}
function match(name,q){
  if(!q)return true;
  return normalize(name).includes(normalize(q));
}

function bd(parts){
  const pos=parts.filter(x=>x>0); if(!pos.length)return'';
  if(pos.length===1)return fmtS(pos[0]);
  return pos.slice(0,6).map(x=>fmt(x)).join(' + ')+(pos.length>6?' +…':'')+" = "+fmtS(pos.reduce((a,b)=>a+b,0));
}

const api={
  get:u=>fetch(u).then(r=>r.json()),
  post:(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),
  put:(u,b)=>fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),
  del:u=>fetch(u,{method:'DELETE'}),
};

function sv(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}

async function load(){
  try{
    const[ps,st]=await Promise.all([api.get('/api/persons'),api.get('/api/stats')]);
    P=ps; renderStats(st); renderList();
  }catch{document.getElementById('plist').innerHTML='<div class="empty">Xatolik yuz berdi</div>';}
}

function renderStats(s){
  document.getElementById('lsub').textContent=`Jami ${P.length} mijoz`;
  document.getElementById('stats').innerHTML=`
    <div class="sc"><div class="sc-l">Umumiy Qarz</div><div class="sc-v r">${fmt(s.total||0)}</div></div>
    <div class="sc"><div class="sc-l">Faol qarzlar</div><div class="sc-v">${s.active||0}</div></div>
    <div class="sc"><div class="sc-l">Yopilganlar</div><div class="sc-v g">${s.paid||0}</div></div>`;
}

function renderList(){
  let data=P.filter(p=>match(p.name,srch));
  if(filt==='high')data=data.filter(p=>p.total>=200000);
  else if(filt==='mid')data=data.filter(p=>p.total>=50000&&p.total<200000);
  else if(filt==='low')data=data.filter(p=>p.total>0&&p.total<50000);
  else if(filt==='paid')data=data.filter(p=>p.total<=0);
  
  if(srt='name'===srt)data.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  else if(srt==='tx')data.sort((a,b)=>b.tx_count-a.tx_count);
  else data.sort((a,b)=>b.total-a.total);

  const el=document.getElementById('plist');
  if(!data.length){el.innerHTML='<div class="empty">Natija topilmadi</div>';return;}
  el.innerHTML=data.map((p,i)=>{
    const paid=p.total<=0;
    return`<div class="pi" onclick="openD(${p.id})">
      <div class="av ${av(p.total)}">${esc(ini(p.name))}</div>
      <div class="pi-info">
        <div class="pi-name">${esc(p.name)}${paid?'<span class="badge paid">✓ Yopilgan</span>':''}</div>
        <div class="pi-bd">${bd(p.breakdown||[])||p.tx_count+' ta amal'}</div>
      </div>
      <div class="pi-amt" style="color:${paid?'var(--g)':'var(--r)'}">${fmt(p.total)}</div>
    </div>`;
  }).join('');
}

function setF(f,btn){filt=f;document.querySelectorAll('.ft').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderList();}
function setSort(s,btn){srt=s;document.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderList();}
function onSrch(){srch=document.getElementById('sq').value;renderList();}

async function openD(id){
  cid=id; const p=P.find(x=>x.id===id); if(!p)return;
  ctot=p.total; cbd=p.breakdown||[];
  document.getElementById('dn').textContent=p.name;
  updHero(); sv('vd');
  await loadTx(id);
}

function updHero(){
  document.getElementById('damt').textContent=fmtS(ctot);
  document.getElementById('damt').className='d-amt '+(ctot<=0?'g':'r');
  document.getElementById('dbd').textContent=bd(cbd);
}

function closeD(){sv('vl');load();}

async function loadTx(id){
  const el=document.getElementById('txlist');
  try{
    const data=await api.get(`/api/persons/${id}/transactions`);
    if(!data.length){el.innerHTML='<div class="empty">Tarix bo\'sh</div>';return;}
    el.innerHTML=data.map(tx=>{
      const cr=tx.amount<0;
      return`<div class="tx" onclick="editNote(${tx.id},'${esc(tx.note||'')}')">
        <div class="tx-ic ${cr?'c':'d'}">${cr?'✓':'$'}</div>
        <div class="tx-info">
          <div class="tx-a" style="color:${cr?'var(--g)':'var(--r)'}">${cr?fmt(-tx.amount):'+'+fmt(tx.amount)} so'm</div>
          <div class="tx-m">${esc(tx.note||'Izohsiz')} · <span style="opacity:0.5">${fmtD(tx.created_at)}</span></div>
        </div>
        <button class="tx-del" onclick="event.stopPropagation();delTx(${tx.id},${tx.amount})">×</button>
      </div>`;
    }).join('');
  }catch{el.innerHTML='<div class="empty">Xato yuz berdi</div>';}
}

async function addTx(){
  const amt=Number(document.getElementById('iamt').value);
  const note=document.getElementById('inote').value.trim();
  if(!amt||amt<=0)return;
  try{
    await api.post('/api/transactions',{person_id:cid,amount:amt,note:note||null,added_by:WHO});
    document.getElementById('iamt').value='';document.getElementById('inote').value='';
    ctot+=amt; cbd.push(amt); updHero(); await loadTx(cid);
  }catch{alert('Xatolik yuz berdi');}
}

async function editNote(tid, oldNote){
  const n = prompt("Izohni o'zgartirish:", oldNote);
  if(n === null) return;
  try {
    await api.put(`/api/transactions/${tid}`, {note: n});
    await loadTx(cid);
  } catch { alert('Xato'); }
}

async function delTx(txid,amt){
  if(!confirm("O'chirilsinmi?"))return;
  try{
    await api.del(`/api/transactions/${txid}`);
    ctot-=amt; if(amt>0){const i=cbd.lastIndexOf(amt);if(i>-1)cbd.splice(i,1);}
    updHero(); await loadTx(cid);
  }catch{alert('Ruxsat berilmadi');}
}

async function markPaid(){
  if(ctot<=0||!confirm("Qarz to'liq yopilsinmi?"))return;
  try{
    await api.post('/api/transactions',{person_id:cid,amount:-ctot,note:"To'liq yopildi",added_by:WHO});
    ctot=0; cbd=[]; updHero(); await loadTx(cid);
  }catch{alert('Xato');}
}

async function partPay(){
  const s=prompt("To'langan summa (so'm):"); if(!s)return;
  const amt=Number(s); if(!amt||amt<=0)return;
  try{
    await api.post('/api/transactions',{person_id:cid,amount:-amt,note:"Qisman to'lov",added_by:WHO});
    ctot-=amt; updHero(); await loadTx(cid);
  }catch{alert('Xato');}
}

async function deleteP(){
  if(!confirm("Mijoz o'chirilsinmi? Barcha tarixi yo'qoladi."))return;
  try{await api.del(`/api/persons/${cid}`); closeD();}catch{alert('Xato');}
}

function shareDebt(){
  const p=P.find(x=>x.id===cid);
  const text = `👤 Mijoz: ${p.name}\n💰 Umumiy qarz: ${fmtS(ctot)}\n📊 Holat: ${ctot>0?'Faol qarz':'Qarz yo\'q'}\n\nTizim orqali hisoblandi.`;
  navigator.clipboard.writeText(text).then(()=>alert('Ma\'lumot nusxalandi! Mijozga yuborishingiz mumkin.'));
}

function exportTxt(){
  const active=P.filter(p=>p.total>0);
  const lines=active.map(p=>`${p.name}: ${fmtS(p.total)}`);
  lines.push('','Jami active qarzlar: '+fmtS(active.reduce((s,p)=>s+p.total,0)));
  const blob=new Blob([lines.join('\n')],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`qarzdorlar.txt`; a.click();
}

function openM(){document.getElementById('mn').value='';document.getElementById('ma').value='';document.getElementById('modal').classList.add('on');}
function mbgClk(e){if(e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('on');}

async function addP(){
  const name=document.getElementById('mn').value.trim();
  const amt=Number(document.getElementById('ma').value)||0;
  if(!name)return;
  try{
    const res=await api.post('/api/persons',{name});
    if(!res.ok) { alert('Mijoz qo\'shishda xatolik (balki bu ism bordur)'); return; }
    const per=await res.json();
    if(amt>0)await api.post('/api/transactions',{person_id:per.id,amount:amt,note:"Boshlang'ich yuklash",added_by:WHO});
    document.getElementById('modal').classList.remove('on'); load();
  }catch{alert('Mijozni qo\'shishda xatolik');}
}

load();
</script>
</body>
</html>
