<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Qarzdorlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#0b0d12; --s1:#13161f; --s2:#1a1e2b; --s3:#20253a;
  --br:rgba(255,255,255,0.06); --br2:rgba(255,255,255,0.1);
  --tx:#edeae0; --mu:#525970; --mu2:#7a8099;
  --gold:#c8a84b; --gold-a:rgba(200,168,75,0.12); --gold-b:rgba(200,168,75,0.22);
  --red:#d95f5f; --ora:#d4834a; --yel:#c8aa3a; --grn:#4a9e72; --blu:#5880c8;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,Roboto,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.view{display:none;flex-direction:column;height:100dvh;height:100vh}
.view.on{display:flex}

/* NAV */
.nav{padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:10;flex-shrink:0}
.nav-row{display:flex;align-items:center;gap:8px}
.back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:2px 10px 2px 0;line-height:1}
.nav-title{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-hint{font-size:11px;color:var(--mu);margin-top:2px}

/* ROLE CHIP */
.role-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.03em;flex-shrink:0}
.chip-seller{background:rgba(74,158,114,0.15);color:var(--grn);border:1px solid rgba(74,158,114,0.25)}
.chip-viewer{background:rgba(82,89,112,0.15);color:var(--mu2);border:1px solid var(--br)}

/* VIEWER NOTICE */
.vnotice{margin:8px 14px 0;padding:9px 12px;background:rgba(82,89,112,0.1);border:1px solid var(--br);border-radius:var(--r);font-size:12px;color:var(--mu2);display:flex;align-items:center;gap:7px}

/* SEARCH */
.sbox{padding:8px 14px 4px;flex-shrink:0}
.sinp{width:100%;padding:9px 36px 9px 14px;background:var(--s1);border:1px solid var(--br);border-radius:var(--r);color:var(--tx);font-size:14px;outline:none;transition:border-color .15s}
.sinp:focus{border-color:var(--gold-b)}
.sinp::placeholder{color:var(--mu)}
.sclr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mu);font-size:18px;cursor:pointer;display:none}
.swrap{position:relative}

/* STATS BAR */
.stats{display:flex;gap:7px;padding:8px 14px 4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--gold-a);border:1px solid var(--gold-b);border-radius:var(--r);padding:7px 12px;flex-shrink:0}
.stat-l{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.stat-v{font-size:12px;font-weight:700;color:var(--gold);margin-top:2px}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;padding:8px 14px 80px}

/* PERSON CARD */
.card{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--s1);border:1px solid var(--br);border-radius:var(--r);margin-bottom:6px;cursor:pointer;transition:background .1s;position:relative}
.card:active{background:var(--s2)}
.tbar{width:3px;height:34px;border-radius:2px;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11px;color:var(--mu);margin-top:2px}
.cright{text-align:right;flex-shrink:0}
.camt{font-size:14px;font-weight:700}
.cunit{font-size:10px;color:var(--mu);margin-top:1px}
.rank-badge{font-size:9px;background:var(--gold-a);color:var(--gold);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle}

/* FAB */
.fab{position:fixed;bottom:20px;right:16px;width:52px;height:52px;border-radius:26px;background:var(--gold);color:#0b0d12;font-size:26px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(200,168,75,.45);z-index:20;transition:transform .1s}
.fab:active{transform:scale(.93)}

/* DETAIL — ADD STRIP */
.astrip{padding:9px 12px;background:var(--gold-a);border-bottom:1px solid var(--gold-b);display:flex;gap:6px;flex-shrink:0}
.inp{background:var(--s1);border:1px solid var(--br);border-radius:8px;padding:9px 11px;color:var(--tx);font-size:14px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--gold-b)}
.iamt{width:105px}
.inote{flex:1}
.btnadd{background:var(--gold);color:#0b0d12;border:none;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .1s;white-space:nowrap}
.btnadd:disabled{opacity:.5}
.btnadd:active{opacity:.8}

/* TOTAL ROW (detail) */
.dtotal-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;flex-shrink:0}
.dtotal-label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.dtotal-val{font-size:17px;font-weight:700;color:var(--gold)}

/* TX ITEMS */
.tx{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--br)}
.tx:last-child{border-bottom:none}
.tx-icon{width:34px;height:34px;border-radius:8px;background:rgba(217,95,95,.1);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tx-body{flex:1;min-width:0}
.tx-amt{font-size:14px;font-weight:700;color:var(--red)}
.tx-meta{font-size:11px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btndel{background:none;border:none;color:var(--br2);font-size:20px;cursor:pointer;padding:4px 6px;transition:color .12s;line-height:1}
.btndel:active{color:var(--red)}
.btnrename{background:none;border:none;color:var(--mu);font-size:12px;cursor:pointer;padding:3px 7px;border:1px solid var(--br);border-radius:5px;margin-left:4px;transition:color .1s}
.btnrename:active{color:var(--gold)}

/* SECTION HEADER */
.sec-h{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;padding:10px 0 5px}

/* MODAL / SHEET */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;align-items:flex-end;backdrop-filter:blur(2px)}
.overlay.on{display:flex}
.sheet{width:100%;background:#171c28;border-radius:18px 18px 0 0;padding:16px 16px 36px}
.handle{width:36px;height:4px;background:var(--br2);border-radius:2px;margin:0 auto 14px}
.sh-title{font-size:15px;font-weight:700;margin-bottom:12px}
.sh-inp{width:100%;background:var(--s1);border:1px solid var(--br);border-radius:var(--r);padding:12px 14px;color:var(--tx);font-size:15px;outline:none;margin-bottom:8px;display:block;transition:border-color .15s}
.sh-inp:focus{border-color:var(--gold-b)}
.sh-btn{width:100%;background:var(--gold);color:#0b0d12;border:none;border-radius:var(--r);padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .1s}
.sh-btn:active{opacity:.85}
.sh-row{display:flex;gap:7px;margin-top:8px}
.sh-btn-sec{flex:1;background:var(--s2);color:var(--mu2);border:1px solid var(--br);border-radius:var(--r);padding:11px;font-size:14px;cursor:pointer}

/* MISC */
.empty{text-align:center;padding:36px 20px;color:var(--mu);font-size:14px}
.divider{height:1px;background:var(--br);margin:4px 0}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-left:5px;vertical-align:middle}
</style>
</head>
<body>

<!-- ═══ LIST VIEW ═══ -->
<div id="vl" class="view on">
  <div class="nav">
    <div class="nav-row">
      <div style="flex:1">
        <div class="nav-title">Qarzdorlar</div>
        <div class="nav-hint" id="lhint">Yuklanmoqda…</div>
      </div>
      <div id="rchip"></div>
    </div>
  </div>
  <div id="vnotice" style="display:none" class="vnotice">🔒 Ko'rish rejimi — tahrirlash mumkin emas</div>
  <div class="sbox"><div class="swrap">
    <input class="sinp" id="srch" placeholder="Ism bo'yicha qidirish…" oninput="renderList()" autocomplete="off">
    <button class="sclr" id="sclr" onclick="clearS()">×</button>
  </div></div>
  <div class="stats" id="stats"></div>
  <div class="scroll" id="lel"><div class="empty">Yuklanmoqda…</div></div>
  <button class="fab" id="fab" style="display:none" onclick="openSheet('add-person')">+</button>
</div>

<!-- ═══ DETAIL VIEW ═══ -->
<div id="vd" class="view">
  <div class="nav">
    <div class="nav-row">
      <button class="back" onclick="goBack()">←</button>
      <div style="flex:1;min-width:0">
        <div class="nav-title" id="dname"></div>
        <div class="nav-hint" id="dmeta"></div>
      </div>
      <button class="btnrename" id="btn-rename" style="display:none" onclick="openSheet('rename')">Nom ✎</button>
    </div>
  </div>
  <div class="dtotal-row">
    <span class="dtotal-label">Jami qarzi</span>
    <span class="dtotal-val" id="dtotal"></span>
  </div>
  <div class="astrip" id="astrip" style="display:none">
    <input class="inp iamt" id="iamt" type="number" placeholder="Summa" inputmode="numeric" min="1">
    <input class="inp inote" id="inote" type="text" placeholder="Izoh (ixtiyoriy)">
    <button class="btnadd" id="btnadd" onclick="addTx()">＋ Qo'sh</button>
  </div>
  <div class="scroll" id="txel"><div class="empty">Yuklanmoqda…</div></div>
</div>

<!-- ═══ SHEET: ADD PERSON ═══ -->
<div class="overlay" id="sh-add-person" onclick="closeSheetClick(event,'sh-add-person')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sh-title">Yangi qarzdor</div>
    <input class="sh-inp" id="sn-name" type="text" placeholder="To'liq ism (masalan: Zulfiya opa)">
    <input class="sh-inp" id="sn-amt" type="number" placeholder="Boshlang'ich summa (ixtiyoriy)" inputmode="numeric" min="0">
    <input class="sh-inp" id="sn-note" type="text" placeholder="Izoh (ixtiyoriy)">
    <button class="sh-btn" onclick="submitAddPerson()">Qo'shish →</button>
    <div class="sh-row"><button class="sh-btn-sec" onclick="closeSheet('sh-add-person')">Bekor qilish</button></div>
  </div>
</div>

<!-- ═══ SHEET: RENAME PERSON ═══ -->
<div class="overlay" id="sh-rename" onclick="closeSheetClick(event,'sh-rename')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sh-title">Ismni o'zgartirish</div>
    <input class="sh-inp" id="sr-name" type="text" placeholder="Yangi ism">
    <button class="sh-btn" onclick="submitRename()">Saqlash →</button>
    <div class="sh-row"><button class="sh-btn-sec" onclick="closeSheet('sh-rename')">Bekor qilish</button></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand(); tg?.ready();
const INIT = tg?.initData || '';
const AH = {'Content-Type':'application/json','X-Init-Data':INIT};
const RH = {'X-Init-Data':INIT};

let persons=[], role='viewer', callerName='', curId=null, curTotal=0;

const fmt  = n => (+n).toLocaleString('ru-RU') + ' сўм';
const fmtN = n => (+n).toLocaleString('ru-RU');
const esc  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tc   = t => t>=400000?'#d95f5f':t>=200000?'#d4834a':t>=100000?'#c8aa3a':t>=50000?'#4a9e72':'#525970';
const fd   = d => { if(!d)return''; const x=new Date(d.endsWith('Z')?d:d+'Z'); return x.toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };

const show = id => { document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); document.getElementById(id).classList.add('on'); };
const openSheet  = id => { document.getElementById('sh-'+id).classList.add('on'); setTimeout(()=>document.querySelector('#sh-'+id+' .sh-inp')?.focus(),80); };
const closeSheet = id => document.getElementById('sh-'+id).classList.remove('on');
const closeSheetClick = (e,id) => { if(e.target===document.getElementById('sh-'+id)) closeSheet(id); };

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  const me = await fetch('/api/me',{headers:RH}).then(r=>r.json()).catch(()=>({role:'viewer',name:''}));
  role = me.role; callerName = me.name || 'Sotuvchi';

  const chip = document.getElementById('rchip');
  if (role==='seller') {
    chip.innerHTML = `<span class="role-chip chip-seller">🟢 ${esc(callerName)}</span>`;
    document.getElementById('fab').style.display = 'flex';
  } else {
    chip.innerHTML = `<span class="role-chip chip-viewer">👁 Ko'ruvchi</span>`;
    document.getElementById('vnotice').style.display = 'flex';
  }
  await loadPersons();
}

// ── LIST ─────────────────────────────────────────────────────────────────────
async function loadPersons() {
  persons = await fetch('/api/persons').then(r=>r.json()).catch(()=>[]);
  renderList(); renderStats();
}

function renderStats() {
  const total = persons.reduce((s,p)=>s+p.total,0);
  const b200  = persons.filter(p=>p.total>=200000).length;
  document.getElementById('lhint').textContent = `${persons.length} nafar · ${fmt(total)}`;
  document.getElementById('stats').innerHTML = [
    {l:'Jami qarzdorlar', v:persons.length+' nafar'},
    {l:'Umumiy qarz',     v:fmt(total)},
    {l:'≥ 200K',          v:b200+' ta'},
    {l:"O'rtacha",        v:fmt(persons.length?Math.round(total/persons.length):0)},
  ].map(s=>`<div class="stat"><div class="stat-l">${s.l}</div><div class="stat-v">${s.v}</div></div>`).join('');
}

function renderList() {
  const q  = document.getElementById('srch').value.toLowerCase();
  const cl = document.getElementById('sclr');
  cl.style.display = q ? 'block' : 'none';
  const d = persons.filter(p=>p.name.toLowerCase().includes(q));
  const el = document.getElementById('lel');
  if (!d.length) { el.innerHTML='<div class="empty">Topilmadi</div>'; return; }
  el.innerHTML = d.map((p,i)=>`
    <div class="card" onclick="openDetail(${p.id})">
      <div class="tbar" style="background:${tc(p.total)}"></div>
      <div class="cinfo">
        <div class="cname">${esc(p.name)}${i<3?`<span class="rank-badge">${['🥇','🥈','🥉'][i]}</span>`:''}</div>
        <div class="cmeta">${p.tx_count} ta tranzaksiya</div>
      </div>
      <div class="cright">
        <div class="camt" style="color:${tc(p.total)}">${fmtN(p.total)}</div>
        <div class="cunit">сўм</div>
      </div>
    </div>`).join('');
}

function clearS() { document.getElementById('srch').value=''; renderList(); }

// ── DETAIL ───────────────────────────────────────────────────────────────────
async function openDetail(id) {
  curId = id;
  const p = persons.find(x=>x.id===id); if(!p) return;
  curTotal = p.total;
  document.getElementById('dname').textContent   = p.name;
  document.getElementById('dmeta').textContent   = `${p.tx_count} ta tranzaksiya`;
  document.getElementById('dtotal').textContent  = fmt(p.total);
  document.getElementById('astrip').style.display= role==='seller'?'flex':'none';
  document.getElementById('btn-rename').style.display = role==='seller'?'block':'none';
  document.getElementById('iamt').value = '';
  document.getElementById('inote').value = '';
  show('vd');
  tg?.BackButton?.show();
  tg?.BackButton?.onClick(goBack);
  await loadTx(id);
}

function goBack() {
  tg?.BackButton?.hide();
  show('vl');
  const p = persons.find(x=>x.id===curId);
  if(p){ p.total=curTotal; renderList(); renderStats(); }
}

async function loadTx(id) {
  const el = document.getElementById('txel');
  el.innerHTML = '<div class="empty">Yuklanmoqda…</div>';
  const data = await fetch(`/api/persons/${id}/transactions`).then(r=>r.json()).catch(()=>[]);
  if(!data.length){ el.innerHTML='<div class="empty">Tranzaksiyalar yo\'q</div>'; return; }
  el.innerHTML = `<div class="sec-h">Tranzaksiyalar tarixi</div>` +
    data.map(t=>`
    <div class="tx" id="tx-${t.id}">
      <div class="tx-icon">💸</div>
      <div class="tx-body">
        <div class="tx-amt">− ${fmtN(t.amount)} сўм</div>
        <div class="tx-meta">${[t.note,t.added_by,fd(t.created_at)].filter(Boolean).join(' · ')}</div>
      </div>
      ${role==='seller'?`<button class="btndel" onclick="delTx(${t.id},${t.amount})" title="O'chirish">×</button>`:''}
    </div>`).join('');
}

async function addTx() {
  const amt = Number(document.getElementById('iamt').value);
  const note = document.getElementById('inote').value.trim();
  if(!amt||amt<=0){ document.getElementById('iamt').focus(); return; }
  const btn = document.getElementById('btnadd'); btn.disabled=true;
  const r = await fetch('/api/transactions',{method:'POST',headers:AH,body:JSON.stringify({person_id:curId,amount:amt,note:note||null,added_by:callerName})}).catch(()=>null);
  btn.disabled=false;
  if(!r?.ok){ alert('Xato yuz berdi'); return; }
  document.getElementById('iamt').value='';
  document.getElementById('inote').value='';
  curTotal+=amt;
  document.getElementById('dtotal').textContent=fmt(curTotal);
  const p=persons.find(x=>x.id===curId); if(p){p.total=curTotal;p.tx_count+=1;}
  loadTx(curId);
}

async function delTx(tid,amt) {
  if(!confirm(`${fmtN(amt)} so'mni o'chirishni tasdiqlaysizmi?`)) return;
  await fetch(`/api/transactions/${tid}`,{method:'DELETE',headers:RH});
  document.getElementById('tx-'+tid)?.remove();
  curTotal-=amt;
  document.getElementById('dtotal').textContent=fmt(curTotal);
  const p=persons.find(x=>x.id===curId); if(p){p.total=curTotal;p.tx_count-=1;}
  if(!document.querySelector('#txel .tx')) document.getElementById('txel').innerHTML='<div class="empty">Tranzaksiyalar yo\'q</div>';
}

// ── ADD PERSON ───────────────────────────────────────────────────────────────
async function submitAddPerson() {
  const name = document.getElementById('sn-name').value.trim();
  const amt  = Number(document.getElementById('sn-amt').value)||0;
  const note = document.getElementById('sn-note').value.trim();
  if(!name){ document.getElementById('sn-name').focus(); return; }
  const r = await fetch('/api/persons',{method:'POST',headers:AH,body:JSON.stringify({name})});
  if(!r.ok){ const e=await r.json(); alert(e.detail||'Xato'); return; }
  const p = await r.json();
  if(amt>0) await fetch('/api/transactions',{method:'POST',headers:AH,body:JSON.stringify({person_id:p.id,amount:amt,note:note||"Boshlang'ich",added_by:callerName})});
  closeSheet('add-person');
  document.getElementById('sn-name').value='';
  document.getElementById('sn-amt').value='';
  document.getElementById('sn-note').value='';
  await loadPersons();
}

// ── RENAME ───────────────────────────────────────────────────────────────────
function openRenameSheet() {
  const p = persons.find(x=>x.id===curId); if(!p) return;
  document.getElementById('sr-name').value = p.name;
  openSheet('rename');
}
document.getElementById('btn-rename')?.addEventListener('click', openRenameSheet);

async function submitRename() {
  const name = document.getElementById('sr-name').value.trim();
  if(!name) return;
  const r = await fetch(`/api/persons/${curId}/name`,{method:'PATCH',headers:AH,body:JSON.stringify({name})});
  if(!r.ok){ alert('Xato'); return; }
  closeSheet('rename');
  const p = persons.find(x=>x.id===curId); if(p) p.name=name;
  document.getElementById('dname').textContent=name;
  renderList();
}

// ── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(document.getElementById('vd').classList.contains('on') && role==='seller') addTx();
  if(document.getElementById('sh-add-person').classList.contains('on')) submitAddPerson();
  if(document.getElementById('sh-rename').classList.contains('on')) submitRename();
});

// ── BOOT ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
